{% extends "web/base.html" %}
{% block titulo %}Entrar — Análise de Planilhas{% endblock %}
{% block conteudo %}
<div class="centro">
  <div class="logo-g">AP</div>
  <h1>Análise de Planilhas</h1>
  <p class="apoio">Entre com seu usuário do setor para ver os relatórios.</p>
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  <form method="post" action="/web/login">
    <label for="login">Usuário</label>
    <input id="login" name="login" autocomplete="username" autofocus>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password">
    <button type="submit"><span class="giro"></span><span class="rotulo">Entrar</span></button>
  </form>
  <p class="rodape" style="text-align:center">Versão {{ versao }}</p>
</div>
{% endblock %}
