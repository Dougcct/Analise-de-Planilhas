{% extends "web/base.html" %}
{% block titulo %}{{ titulo }} — Análise de Planilhas{% endblock %}
{% block conteudo %}
<a class="voltar" href="/web">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  Relatórios</a>
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap">
  <h1>{{ titulo }}</h1>
  {% if pode_compartilhar %}
  <a class="btn-sec" href="/web/gestao/relatorio/{{ slug }}" style="padding:8px 14px;margin-top:4px">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="15" height="15"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 13a7.9 7.9 0 0 0 0-2l1.5-1.2-1.5-2.6-1.8.6a7.6 7.6 0 0 0-1.7-1l-.3-1.9h-3l-.3 1.9a7.6 7.6 0 0 0-1.7 1l-1.8-.6-1.5 2.6L6.6 11a7.9 7.9 0 0 0 0 2l-1.5 1.2 1.5 2.6 1.8-.6a7.6 7.6 0 0 0 1.7 1l.3 1.9h3l.3-1.9a7.6 7.6 0 0 0 1.7-1l1.8.6 1.5-2.6L19.4 13z" stroke-linejoin="round"/></svg>
    Gerenciar</a>
  {% endif %}
</div>
{% if pode_compartilhar %}
<details class="compart">
  <summary>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="16" height="16"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.6 15.4 6.4M8.6 13.4l6.8 4.2" stroke-linecap="round"/></svg>
    Compartilhar com outro setor…</summary>
  <form method="post" action="/web/r/{{ slug }}/compartilhar" class="linha" style="margin-top:10px">
    <div class="campos">
      <div><label>Login do destinatário</label><input name="login_destino" required></div>
      <div><label>Prazo (dias)</label><input name="dias" type="number" value="7" min="1" max="90"></div>
      <div><label style="margin-top:26px"><input type="checkbox" name="anonimizar" checked> Anonimizar nomes</label></div>
    </div>
    <button type="submit"><span class="giro"></span><span class="rotulo">Compartilhar</span></button>
  </form>
</details>
{% endif %}
<div class="rel-caixa">
  <div class="rel-carregando" id="rel-load"><span class="giro2"></span><span>Carregando relatório…</span></div>
  <iframe class="relatorio" src="/web/r/{{ slug }}/conteudo" title="{{ titulo }}"
          onload="var l=document.getElementById('rel-load'); if(l){l.style.opacity=0; setTimeout(function(){l.remove()},300);}"></iframe>
</div>
{% endblock %}
