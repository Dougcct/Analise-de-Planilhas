{% extends "web/base.html" %}
{% block titulo %}Trocar senha — Análise de Planilhas{% endblock %}
{% block conteudo %}
<div class="centro">
  <h1 style="color:var(--marca)">Trocar senha</h1>
  <p class="apoio">Defina uma nova senha para continuar.</p>
  {% if erro %}<div class="erro">{{ erro }}</div>{% endif %}
  <form method="post" action="/web/senha">
    <label for="atual">Senha atual</label>
    <input id="atual" name="atual" type="password" autocomplete="current-password">
    <label for="nova">Nova senha</label>
    <input id="nova" name="nova" type="password" autocomplete="new-password" placeholder="ao menos 6 caracteres">
    <label for="confirma">Confirmar nova senha</label>
    <input id="confirma" name="confirma" type="password" autocomplete="new-password">
    <button type="submit">Salvar e entrar</button>
  </form>
</div>
{% endblock %}
