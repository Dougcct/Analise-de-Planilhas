<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Análise de Planilhas{% endblock %}</title>
  <style>
    :root{
      --marca:#00995D; --marca-escura:#007A4B; --marca-clara:#E8F4EF;
      --fundo:#F5F6F8; --superficie:#FFFFFF; --borda:#D9DDE3;
      --texto:#1F2933; --apoio:#5C6773; --perigo:#C0392B; --perigo-claro:#FDF0EE;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI','Noto Sans',Arial,sans-serif;background:var(--fundo);color:var(--texto)}
    header.topo{background:var(--marca);color:#fff;display:flex;align-items:center;justify-content:space-between;
      padding:12px 20px;gap:12px;flex-wrap:wrap}
    header.topo .marca{font-weight:700;font-size:16px}
    header.topo .usuario{font-size:13px;display:flex;align-items:center;gap:14px}
    header.topo a{color:#fff;text-decoration:none;opacity:.95}
    header.topo a:hover{text-decoration:underline}
    main{max-width:1100px;margin:0 auto;padding:22px 16px}
    h1{font-size:22px;margin:0 0 4px}
    .apoio{color:var(--apoio);font-size:13px}
    .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:16px}
    .cartao{background:var(--superficie);border:1px solid var(--borda);border-radius:8px;padding:16px;
      text-decoration:none;color:var(--texto);display:block;transition:border-color .15s}
    .cartao:hover{border-color:var(--marca)}
    .cartao .nome{font-weight:600;color:var(--marca-escura)}
    .centro{max-width:400px;margin:8vh auto 0;background:var(--superficie);border:1px solid var(--borda);
      border-radius:10px;padding:28px}
    label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
    input{width:100%;padding:9px 10px;border:1px solid var(--borda);border-radius:6px;font-size:14px}
    input:focus{outline:none;border-color:var(--marca)}
    button{width:100%;margin-top:18px;background:var(--marca);color:#fff;border:0;border-radius:6px;
      padding:11px;font-weight:700;font-size:14px;cursor:pointer}
    button:hover{background:var(--marca-escura)}
    .erro{background:var(--perigo-claro);border:1px solid var(--perigo);color:var(--perigo);
      border-radius:6px;padding:10px;font-size:13px;margin-top:12px}
    .voltar{display:inline-block;margin-bottom:12px;color:var(--marca-escura);text-decoration:none;font-weight:600}
    iframe.relatorio{width:100%;height:calc(100vh - 150px);min-height:480px;border:1px solid var(--borda);
      border-radius:8px;background:#fff}
    .rodape{color:var(--apoio);font-size:12px;margin-top:18px}
  </style>
</head>
<body>
  {% if nome %}
  <header class="topo">
    <span class="marca">Análise de Planilhas</span>
    <span class="usuario">{{ nome }} · {{ papel }} <a href="/web/logout">Sair</a></span>
  </header>
  {% endif %}
  <main>{% block conteudo %}{% endblock %}</main>
</body>
</html>
