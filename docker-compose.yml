# BASE comum a todos os ambientes (API + PostgreSQL).
#   Desenvolvimento:  docker compose up --build
#       → junta automaticamente o docker-compose.override.yml (publica a API em localhost:8000).
#   Produção:         docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#       → NÃO usa o override (a API fica só atrás do Caddy/TLS; nada exposto além do 443). Fase 7.
# A porta do banco nunca é publicada em nenhum ambiente (rede interna do Docker).
services:
  db:
    image: postgres:16-alpine
    container_name: analise-planilhas-banco      # nome claro no Docker Desktop (o banco do app)
    environment:
      POSTGRES_USER: analise
      POSTGRES_PASSWORD: analise      # SÓ desenvolvimento; produção usa secret/.env (DOCS/18 §7)
      POSTGRES_DB: analise
    volumes:
      - dados_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analise -d analise"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: servidor/Dockerfile
    image: analise-planilhas-api:dev
    container_name: analise-planilhas-servidor    # nome claro no Docker Desktop (o servidor do app)
    environment:
      DATABASE_URL: postgresql+psycopg://analise:analise@db:5432/analise
      CARGAS_DIR: /app/dados_cargas
    volumes:
      - cargas:/app/dados_cargas                  # planilhas brutas enviadas (fora da imagem; LGPD)
      - modelos:/app/config/modelos               # modelos editáveis em runtime (semeados no 1º start)
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # A publicação da porta 8000 fica no docker-compose.override.yml (só desenvolvimento).

volumes:
  dados_db:
  cargas:
  modelos:
