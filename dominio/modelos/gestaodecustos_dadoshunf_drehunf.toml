# =============================================================================
# MODELO — Dados Hunf · DRE HUNF (demonstrativo de resultado: conta × mês)
# =============================================================================
# A aba «DRE HUNF» é uma matriz: uma linha por conta, uma coluna por mês. A receita vem POSITIVA e os
# custos/despesas NEGATIVOS. Os blocos e linhas de resultado da DRE estão declarados explicitamente em
# `[[leitura.secao]]`, alinhando os grupos de custos/despesas (Custos Hospitalares, Despesas com
# Empregados, Encargos Sociais, Despesas Administrativas, Outras Despesas Operacionais…) com os demais
# relatórios do setor (CUSTOS e ESPAÇO). O valor de cada cabeçalho de seção é guardado como subtotal
# da planilha para montar o Demonstrativo (DRE) e para a conferência «soma das contas × subtotal».
# As linhas de fórmula/observação («*(Item …)*», «(Soma dos itens …)») são ignoradas. A DRE vai da
# linha 2 (RECEITA…) até 117 (fecho do RESULTADO LÍQUIDO); as mini-tabelas abaixo ficam de fora.
# Ver DOCS/13_financeiro_hunf.md.
# -----------------------------------------------------------------------------

nome           = "Dados Hunf — DRE HUNF"
setor          = "Gestão de Custos"
tipo_documento = "Dados Hunf"
aba            = "DRE HUNF"

[leitura]
formato        = "matriz_mensal"
coluna_rotulo  = 0                # coluna A: nome da conta/bloco
rotulo_conta   = "Conta"
rotulo_grupo   = "Grupo"
rotulo_valor   = "Valor"
agrupamento    = "secoes"         # blocos declarados abaixo (seguem exatamente a DRE)
pular          = []               # subtotais são os próprios cabeçalhos de seção
pular_prefixos = ["*", "(Soma"]   # linhas de fórmula/observação («*(Item…)*», «(Soma dos itens…)») — não são dado
a_partir_de    = "2024-01"
linha_inicio   = 2
linha_fim      = 117              # até o fecho de «RESULTADO LÍQUIDO DO PERÍODO» (abaixo são outras tabelas)

[[leitura.secao]]
inicio = "RECEITA OPERACIONAL BRUTA"
grupo  = "Receita Operacional Bruta"

[[leitura.secao]]
