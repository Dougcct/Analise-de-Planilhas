grupo  = "Outros Resultados Não-Operacionais / Ajustes"

[[leitura.secao]]
inicio = "OUTROS RESULTADOS NÃO-OPERACIONAIS / AJUSTES"
grupo  = "Outros Resultados Não-Operacionais / Ajustes"

[[leitura.secao]]
