[analise]
tipo                  = "serie"
perfil                = "dre"
sentido               = "maior"
medida_principal      = "Valor"
dimensoes             = ["Grupo", "Conta"]
top                   = 20
# linhas da DRE usadas nos indicadores
receita               = "Receita Operacional Bruta"
resultado_operacional = "Resultado Operacional antes Financeiro"
resultado             = "Resultado Líquido do Período"

[[coluna]]
canonico = "grupo"
