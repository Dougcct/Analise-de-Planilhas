# DESENVOLVIMENTO — carregado automaticamente pelo `docker compose up`.
# Única diferença para a base: publica a API em localhost:8000, para testar direto pelo navegador/cliente
# sem TLS. Em produção este arquivo NÃO é usado (lá se passa -f docker-compose.yml -f docker-compose.prod.yml),
# então a API nunca fica exposta fora da rede do Docker — só o Caddy (443) responde (fase 7).
services:
  api:
    ports:
      - "80:8000"       # link sem porta: http://<servidor>   (ex.: http://analise)
      - "8000:8000"     # mantém o :8000 (descoberta automática do cliente desktop usa essa porta)
    volumes:
      - ./src:/app/src:ro
      - ./dominio/Agentes:/app/dominio/Agentes:ro
      - ./servidor:/app/servidor:ro
      - ./templates:/app/templates:ro
      - ./assets:/app/assets:ro
      - ./automacao:/app/automacao:ro
      - ./cerebro_db:/app/cerebro_db:ro
      - ./config/kpis_ceosgo.json:/app/config/kpis_ceosgo.json:ro
